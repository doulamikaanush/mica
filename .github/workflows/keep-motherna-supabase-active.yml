name: Keep Motherna Supabase active

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send safe database activity
        env:
          SUPABASE_URL: https://lljcncxrsqldlenhdtnj.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_IwuZWS2JmvU1uSvDITK5xQ_YQ7XGtXx
        run: |
          for attempt in 1 2 3; do
            status=$(curl --silent --show-error \
              --retry 6 \
              --retry-all-errors \
              --retry-delay 10 \
              --connect-timeout 20 \
              --output /tmp/motherna-supabase-response.json \
              --write-out "%{http_code}" \
              "$SUPABASE_URL/rest/v1/admin_allowlist?select=created_at&limit=1" \
              --header "apikey: $SUPABASE_PUBLISHABLE_KEY")

            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "Supabase keepalive failed with HTTP $status"
              exit 1
            fi

            sleep 2
          done

          echo "Motherna Supabase activity completed successfully."

  maintain-scheduled-workflow:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Keep scheduled workflows enabled
        shell: bash
        run: |
          last_commit_epoch=$(git log -1 --format=%ct)
          now_epoch=$(date +%s)
          max_idle_seconds=$((45 * 24 * 60 * 60))

          if ((now_epoch - last_commit_epoch < max_idle_seconds)); then
            echo "Repository activity is recent; no maintenance commit needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep scheduled workflows active"
          git push
